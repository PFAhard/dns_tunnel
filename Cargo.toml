[package]
edition = "2024"
name = "dns_tunnel"
version = "0.1.0"

[dependencies]
eframe = {version = "0.36.2", features = ["persistence"]} 
egui = "0.36.2" # if not already a direct dep
ferrisetw = "1.2.0" 
psl = "2.1.238" 
ron = "0.12.2" 
serde = {version = "1.0.229", features = ["derive"]} 
tray-icon = "0.25.1" # cross-platform tray icon crate

[target.'cfg(windows)'.dependencies]
windows = {version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
]}

# Lints apply to the whole crate (lib + bin + tests).
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
